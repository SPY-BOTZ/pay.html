<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Payment App...</title>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount') || '5';
            const upi = urlParams.get('upi') || 'BHARATPE.9Q0Q0K0Z8Q466572@unitype';
            
            // Direct UPI intent link
            const upiLink = `upi://pay?pa=${upi}&am=${amount}.00&pn=SubscriptionBot&cu=INR`;
            
            // Redirect user directly to UPI app
            window.location.href = upiLink;
            
            // Fallback text agar app open na ho
            setTimeout(function() {
                document.getElementById('fallback').style.display = 'block';
            }, 2000);
        };
    </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9;">
    <h2>Redirecting to your Payment App...</h2>
    <p>Please wait while we securely redirect you to your UPI app.</p>
    <div id="fallback" style="display:none; margin-top: 30px;">
        <p>If your app didn't open automatically, click the button below:</p>
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount') || '5';
            const upi = urlParams.get('upi') || 'BHARATPE.9Q0Q0K0Z8Q466572@unitype';
            document.write(`<a href="upi://pay?pa=${upi}&am=${amount}.00&pn=SubscriptionBot&cu=INR" style="background: #5865F2; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold;">Open UPI App Manually</a>`);
        </script>
    </div>
</body>
</html>
